name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppLauncher-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare Release Asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AppLauncher.apk
          echo "Copied APK to AppLauncher.apk"

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.0
          name: "App Launcher Android App v1.0.0 (Official Release)"
          fail_on_unmatched_files: true
          body: |
            ### ?? App Launcher Official Android Application (v1.0.0)
            - **Wallpaper Transparency**: Device wallpaper is clearly visible behind the single clean home screen slide with frosted glass styling.
            - **3 Layout Modes**: Switch between **Sections** (categorized cards), **Grid** (4-column grid), and **Minimal List** (clean vertical list with badges).
            - **Single Clean Home Screen**: Zero icon clutter on desktop; contains only App Launcher hub, Settings, Play Store, Gallery, and Bottom Dock.
            - **Auto-Categorization**: Newly installed apps are automatically filed into categories and never clutter the home screen.
            - **App Reminders & Alarms**: Set custom one-time or repeating reminders with buzzer alarms and Text-to-Speech (TTS) voice alerts.
            - **Category Customization**: Create custom categories and reorder categories up and down.
            - **Direct Download**:
              - Tap AppLauncher.apk below to download and install directly on your Android phone!
          files: |
            AppLauncher.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
