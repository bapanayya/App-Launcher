name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android APK and AAB Bundle
        run: |
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleRelease --stacktrace

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppLauncher-Release-Assets
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab

      - name: Prepare Release Assets
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AppLauncher.apk
          cp app/build/outputs/bundle/release/app-release.aab AppLauncher.aab
          echo "Prepared AppLauncher.apk and AppLauncher.aab"

      - name: Create or Update GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.1' }}
          name: "App Launcher Android App ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.1' }} (Official Release)"
          fail_on_unmatched_files: true
          body: |
            ### 🚀 App Launcher Official Android Application (v1.0.0)
            - **Wallpaper Transparency**: Device wallpaper is clearly visible behind the single clean home screen slide with frosted glass styling.
            - **3 Layout Modes**: Switch between **Sections** (categorized cards), **Grid** (4-column grid), and **Minimal List** (clean vertical list with badges).
            - **Single Clean Home Screen**: Zero icon clutter on desktop; contains only App Launcher hub, Settings, Play Store, Gallery, and Bottom Dock.
            - **Auto-Categorization**: Newly installed apps are automatically filed into categories and never clutter the home screen.
            - **App Reminders & Alarms**: Set custom one-time or repeating reminders with buzzer alarms and Text-to-Speech (TTS) voice alerts.
            - **Category Customization**: Create custom categories and reorder categories up and down.
            - **Google Play Ready**: Fully signed `.aab` (Android App Bundle) with 10,000-day keystore, Target SDK 35, and strict on-device privacy.
            - **Downloads**:
              - **AppLauncher.apk**: Direct standalone Android installation APK.
              - **AppLauncher.aab**: Signed Android App Bundle for Google Play Console distribution.
          files: |
            AppLauncher.apk
            AppLauncher.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
